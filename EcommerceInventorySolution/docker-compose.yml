version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: EcommerceInventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: godika
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"       # AMQP protocol
      - "15672:15672"     # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  api:
    build:
      context: .
      dockerfile: EcommerceInventory.Api/Dockerfile
    container_name: ecommerce-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EcommerceInventory;Username=postgres;Password=godika
      # RabbitMQ
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672      
      - RabbitMQ__Exchange=loyalty-events
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data: